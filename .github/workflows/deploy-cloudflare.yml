# Publishes the site to Cloudflare Workers on every push to main. It first runs the same checks as
# a pull request ("PR check", pr-check.yml), and publishes nothing if any of them fails.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account ID shown in the Cloudflare dashboard
name: Deploy to Cloudflare

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One deploy at a time, in order; a deploy in progress is never cut short.
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  check:
    name: PR check
    uses: ./.github/workflows/pr-check.yml

  deploy:
    name: Deploy to Cloudflare Workers
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Vite and Wrangler run on Node; Bun installs the packages from bun.lock.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
