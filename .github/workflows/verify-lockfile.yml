# Fails when .github/workflows/actions.lock is out of sync with the workflows, or a locked commit
# no longer matches its action upstream. After adding a workflow or changing any `uses:`, run
# `gh actions-lock` and commit the updated lockfile.
#
# Based on github/gh-actions-lock's .github/workflows/verify-lockfile.yml.
name: verify-lockfile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
