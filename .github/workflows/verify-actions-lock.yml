# Checks that .github/workflows/actions.lock, which pins every action the workflows use to an exact
# commit, is up to date and that each pinned commit still matches its action upstream. (Not to be
# confused with bun.lock, which pins the site's packages.)
#
# After adding a workflow or changing any `uses:`, run `gh actions-lock` and commit the updated
# actions.lock. Based on github/gh-actions-lock's .github/workflows/verify-lockfile.yml.
name: Verify actions.lock

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify actions.lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
